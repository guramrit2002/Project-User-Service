version: "3.9"

services:
  user_service:
    build: .
    container_name: user_service
    ports:
      - "8001:8000"
    volumes:
      - .:/app
      - sqlite_data:/app
    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000
      "
    env_file:
      - .env

volumes:
  sqlite_data:
